name: Resolve dependency security advisories

on:
  push:
    branches:
      - release/1.9.0
    paths:
      - .github/workflows/sync-generated-ai-final.yml

permissions:
  contents: write

concurrency:
  group: resolve-v1.9.1-dependency-advisories
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/1.9.0
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Match repository npm version
        run: npm install --global npm@11.6.0

      - name: Pin patched transitive dependency floors
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...pkg.overrides,
            'js-yaml': '4.3.1',
            postcss: '8.5.23',
            hono: '4.13.2',
            nanoid: '3.3.18',
            tar: '7.5.21',
            xcode: {
              ...(pkg.overrides?.xcode ?? {}),
              uuid: '11.1.1',
            },
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          node <<'NODE'
          const fs = require('node:fs');

          const path = 'release-notes/v1.9.1.md';
          let notes = fs.readFileSync(path, 'utf8');
          const heading = '## Security hardening';
          if (!notes.includes(heading)) {
            const block = `${heading}\n\n- Closed the active js-yaml, uuid, PostCSS, Hono, brace-expansion, nanoid, and node-tar advisories by enforcing patched dependency floors, applying safe lockfile updates, and adding a permanent regression test.\n\n`;
            notes = notes.replace('## Validation', `${block}## Validation`);
            fs.writeFileSync(path, notes);
          }
          NODE

          cat > tests/tooling/dependency-security.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          const compare = (left, right) => {
            const leftParts = left.split('.').map(Number);
            const rightParts = right.split('.').map(Number);
            for (let index = 0; index < 3; index += 1) {
              const difference = (leftParts[index] ?? 0) - (rightParts[index] ?? 0);
              if (difference !== 0) return difference;
            }
            return 0;
          };

          const resolvedVersions = (packageName) =>
            Object.entries(lock.packages)
              .filter(([path]) => path.endsWith(`node_modules/${packageName}`))
              .map(([path, metadata]) => ({ path, version: metadata.version }));

          const assertEveryResolvedVersionIsSafe = (packageName, isSafe) => {
            const resolved = resolvedVersions(packageName);
            assert.ok(resolved.length > 0, `${packageName} must be present in package-lock.json`);
            const unsafe = resolved.filter(({ version }) => !isSafe(version));
            assert.deepEqual(unsafe, [], `${packageName} contains a vulnerable resolved version`);
          };

          test('security-sensitive transitive dependencies stay above patched floors', () => {
            assertEveryResolvedVersionIsSafe('js-yaml', (version) => {
              const major = Number(version.split('.')[0]);
              if (major === 3) return compare(version, '3.15.1') >= 0;
              if (major === 4) return compare(version, '4.3.1') >= 0;
              if (major === 5) return compare(version, '5.2.1') >= 0;
              return major > 5;
            });

            assertEveryResolvedVersionIsSafe(
              'postcss',
              (version) => compare(version, '8.5.23') >= 0,
            );
            assertEveryResolvedVersionIsSafe(
              'hono',
              (version) => compare(version, '4.12.34') >= 0,
            );
            assertEveryResolvedVersionIsSafe('uuid', (version) => {
              const major = Number(version.split('.')[0]);
              if (major < 11) return false;
              if (major === 11) return compare(version, '11.1.1') >= 0;
              if (major === 12) return compare(version, '12.0.1') >= 0;
              if (major === 13) return compare(version, '13.0.1') >= 0;
              return major >= 14;
            });
            assertEveryResolvedVersionIsSafe('brace-expansion', (version) => {
              const major = Number(version.split('.')[0]);
              if (major === 1) return compare(version, '1.1.18') >= 0;
              if (major === 2) return compare(version, '2.1.4') >= 0;
              if (major === 3) return compare(version, '3.0.6') >= 0;
              if (major === 4) return false;
              if (major === 5) return compare(version, '5.0.9') >= 0;
              return major > 5;
            });
            assertEveryResolvedVersionIsSafe('nanoid', (version) => {
              const major = Number(version.split('.')[0]);
              if (major < 3) return false;
              if (major === 3) return compare(version, '3.3.18') >= 0;
              if (major === 4) return false;
              if (major === 5) return compare(version, '5.1.6') >= 0;
              return major > 5;
            });
            assertEveryResolvedVersionIsSafe('tar', (version) => {
              const major = Number(version.split('.')[0]);
              if (major === 7) return compare(version, '7.5.21') >= 0;
              return major > 7;
            });
          });
          EOF

      - name: Regenerate and install the verified lockfile
        env:
          NPM_CONFIG_FUND: 'false'
        run: |
          set -euo pipefail
          NPM_CONFIG_AUDIT=false npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          NPM_CONFIG_AUDIT=false npm ci
          (cd functions && NPM_CONFIG_AUDIT=false npm ci --ignore-scripts)

      - name: Prove dependency resolution and zero-audit state
        run: |
          set -euo pipefail
          npm ls js-yaml postcss hono uuid brace-expansion nanoid tar --all
          npm run test:tooling
          npm audit --audit-level=low
          npm run security:audit
          npm --prefix functions audit --audit-level=high

      - name: Run application and Functions regression gates
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm run typecheck:tsc
          npm run test
          npm run functions:validate
          npm run build
          npm run quality:release
          npm run release:branch-check
          git diff --check

      - name: Commit only the verified security changes
        run: |
          set -euo pipefail
          rm .github/workflows/sync-generated-ai-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            package-lock.json \
            release-notes/v1.9.1.md \
            tests/tooling/dependency-security.test.mjs \
            .github/workflows/sync-generated-ai-final.yml
          git diff --cached --check
          HUSKY=0 git commit -m "fix(security): close dependency advisories"
          git fetch origin release/1.9.0
          git rebase origin/release/1.9.0
          git push origin HEAD:release/1.9.0
