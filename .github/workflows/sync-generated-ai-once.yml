name: Sync generated AI artifacts once

on:
  push:
    branches:
      - release/1.9.0
    paths:
      - .github/workflows/sync-generated-ai-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/1.9.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and normalize AI artifacts
        run: |
          set -euo pipefail
          npm run knowledge:build
          npm run lint:fix
          npm run format:check

      - name: Reject unexpected non-generated changes
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- . ':(exclude).ai/**' ':(exclude).github/workflows/sync-generated-ai-once.yml')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-generated changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit synchronized generated artifacts
        run: |
          set -euo pipefail
          rm .github/workflows/sync-generated-ai-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .ai/CURRENT_STATE.md \
            .ai/QUICK_ROUTER.md \
            .ai/executive-function \
            .ai/graphs \
            .ai/hashes \
            .ai/manifests \
            .github/workflows/sync-generated-ai-once.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "chore(ai): refresh generated knowledge artifacts"
          git push origin HEAD:release/1.9.0
